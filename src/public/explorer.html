<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorateur DevOps - Mini Projet</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --code-bg: #0b1120;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Background Animation --- */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
            opacity: 0.5;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        /* --- Header --- */
        header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        header h1 span {
            color: var(--accent);
            font-family: 'Fira Code', monospace;
        }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }

        /* --- Main Layout --- */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            background: rgba(30, 41, 59, 0.5);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .file-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            border: 1px solid transparent;
        }

        .file-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        .file-item.active {
            background: var(--accent);
            color: var(--bg);
            font-weight: 600;
        }

        .file-icon { width: 16px; opacity: 0.7; }

        /* --- Editor Area --- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--code-bg);
        }

        .editor-header {
            padding: 0.75rem 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            color: var(--accent);
        }

        .code-view {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            position: relative;
        }

        .line {
            display: flex;
            padding: 0.1rem 1.5rem;
            transition: background 0.2s;
            cursor: pointer;
            position: relative;
        }

        .line:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .line.has-info::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
            opacity: 0.5;
        }

        .line.active {
            background: rgba(56, 189, 248, 0.15);
        }

        .line-number {
            width: 3rem;
            color: var(--text-dim);
            opacity: 0.4;
            user-select: none;
            text-align: right;
            padding-right: 1.5rem;
        }

        .line-content {
            white-space: pre;
            color: #e2e8f0;
        }

        /* --- Info Panel --- */
        .info-panel {
            width: 400px;
            background: var(--surface);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
        }

        .info-panel.visible {
            transform: translateX(0);
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-tag {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .close-info {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .info-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .info-desc {
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .info-benefit {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            padding: 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .info-benefit h4 {
            color: var(--success);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            text-align: center;
            padding: 2rem;
        }

        /* --- Syntax highlighting colors --- */
        .hl-keyword { color: #f472b6; }
        .hl-string { color: #34d399; }
        .hl-comment { color: #64748b; font-style: italic; }
        .hl-function { color: #818cf8; }
        .hl-var { color: #fbbf24; }

        @media (max-width: 1024px) {
            .info-panel { width: 100%; transform: translateY(100%); }
            .info-panel.visible { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <header>
        <h1><span>$</span> DEV_EXPLORER</h1>
        <a href="/" class="back-link">← Retour au Dashboard</a>
    </header>

    <main>
        <aside class="sidebar">
            <h2>Project Files</h2>
            <div id="file-list">
                <!-- Injected via JS -->
            </div>
        </aside>

        <section class="editor-container">
            <div class="editor-header" id="current-filename">Sélectionnez un fichier</div>
            <div class="code-view" id="code-view">
                <div class="empty-state">
                    <p>Cliquez sur un fichier à gauche pour explorer son architecture et comprendre l'intérêt de chaque ligne stratégique.</p>
                </div>
            </div>

            <div class="info-panel" id="info-panel">
                <div class="info-header">
                    <div class="info-tag">DevOps Insight</div>
                    <button class="close-info" id="close-info">&times;</button>
                </div>
                <div class="info-content">
                    <h3 class="info-title" id="info-title">Détails de la ligne</h3>
                    <p class="info-desc" id="info-desc" style="margin-top: 1rem;"></p>
                    <div class="info-benefit" style="margin-top: 1.5rem;">
                        <h4>Impact / Intérêt</h4>
                        <p id="info-benefit" style="font-size: 0.875rem;"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const projectData = {
            'Dockerfile': {
                lines: [
                    { content: '# Stage 1: Build & Test', info: 'Commentaire pour la documentation.', benefit: 'Clarifie la structure multi-stage pour les autres développeurs.' },
                    { content: 'FROM node:20-alpine AS builder', info: 'Image de base ultra-légère pour la compilation.', benefit: 'Réduit la surface d\'attaque et accélère le temps de build initial.' },
                    { content: 'WORKDIR /app', info: 'Définit le répertoire de travail dans le conteneur.', benefit: 'Évite de polluer la racine du système de fichiers du conteneur.' },
                    { content: 'COPY package*.json ./', info: 'Copie les fichiers de dépendances séparément.', benefit: 'Permet d\'optimiser le cache Docker : si package.json ne change pas, npm install n\'est pas relancé.' },
                    { content: 'RUN npm install', info: 'Installe toutes les dépendances (y compris de dev).', benefit: 'Prépare l\'environnement pour les tests unitaires.' },
                    { content: 'COPY . .', info: 'Copie le reste du code source.', benefit: 'Isolée après npm install pour ne pas invalider le cache à chaque micro-changement de code.' },
                    { content: 'RUN npm test', info: 'Exécute les tests au moment du build de l\'image.', benefit: 'Garantit qu\'on ne peut pas construire une image qui contient des bugs détectables par les tests (Shift Left Testing).' },
                    { content: ' ', info: null },
                    { content: '# Stage 2: Production', info: 'Deuxième étape : on ne garde que le strict nécessaire.', benefit: 'Optimisation drastique de la taille de l\'image finale.' },
                    { content: 'FROM node:20-alpine', info: 'Image de base propre pour la production.', benefit: 'Pas de compilateurs ou d\'outils de build inutiles en production.' },
                    { content: 'WORKDIR /app', info: 'Redéfinit le répertoire.', benefit: 'Cohérence avec l\'étape de build.' },
                    { content: 'COPY package*.json ./', info: 'On recopie le manifeste.', benefit: 'Nécessaire pour installer uniquement les dépendances de prod.' },
                    { content: 'RUN npm install --omit=dev', info: 'Installation sélective.', benefit: 'Réduit drastiquement le poids du dossier node_modules (pas de Jest, Supertest en prod).' },
                    { content: 'COPY src/ ./src/', info: 'Copie uniquement le code nécessaire.', benefit: 'On exclut les dossiers de tests, doc, et config CI/CD.' },
                    { content: 'ARG APP_VERSION=1.0.0', info: 'Argument de build.', benefit: 'Permet d\'injecter des métadonnées dynamiques (versioning).' },
                    { content: 'ENV APP_VERSION=$APP_VERSION', info: 'Variable d\'environnement.', benefit: 'Rend les métadonnées de build accessibles au code Node.js (via process.env).' },
                    { content: 'EXPOSE 3000', info: 'Indique le port d\'écoute.', benefit: 'Documentation pour les orchestrateurs (Kubernetes/Compose).' },
                    { content: 'HEALTHCHECK --interval=30s --timeout=3s', info: 'Vérification de l\'état de santé.', benefit: 'Permet à Docker de redémarrer automatiquement le conteneur s\'il devient "Unhealthy".' },
                    { content: '  CMD wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1', info: 'Commande de check.', benefit: 'Utilise le endpoint /health que nous avons créé.' },
                    { content: 'CMD ["npm", "start"]', info: 'Point d\'entrée par défaut.', benefit: 'Lance le serveur web.' }
                ]
            },
            'src/app.js': {
                lines: [
                    { content: 'const express = require(\'express\');', info: 'Import du framework web.', benefit: 'Standard de l\'industrie pour des APIs Node.js robustes.' },
                    { content: 'const metricsService = require(\'./services/metricsService\');', info: 'Import de notre service de télémétrie.', benefit: 'Permet de collecter des données sur l\'utilisation du serveur.' },
                    { content: 'const app = express();', info: 'Initialisation.', benefit: 'Instance centrale de l\'application.' },
                    { content: ' ', info: null },
                    { content: '// Middleware to track requests', info: 'Commentaire.', benefit: 'Explique le but du bloc suivant.' },
                    { content: 'app.use((req, res, next) => {', info: 'Middleware global.', benefit: 'S\'exécute à CHAQUE requête entrante.' },
                    { content: '    metricsService.incrementRequestCount();', info: 'Incrémentation des métriques.', benefit: 'Permet d\'avoir des stats en temps réel sur le trafic.' },
                    { content: '    next();', info: 'Passage au middleware suivant.', benefit: 'Crucial pour ne pas bloquer la requête.' },
                    { content: '});', info: 'Fin du middleware.', benefit: '-' },
                    { content: ' ', info: null },
                    { content: 'app.use(express.static(path.join(__dirname, \'public\')));', info: 'Service de fichiers statiques.', benefit: 'Sert le Dashboard HTML au client.' },
                    { content: 'app.use(\'/api\', devopsRoutes);', info: 'Routing API.', benefit: 'Organise le code en séparant les routes API du reste.' },
                    { content: 'app.get(\'*splat\', (req, res) => {', info: 'Fallback pour les Single Page Apps.', benefit: 'Redirige tout vers index.html, laissant le JS gérer les routes frontend.' }
                ]
            },
            'Makefile': {
                lines: [
                    { content: 'DOCKER_COMPOSE := $(shell command -v docker-compose || echo "docker compose")', info: 'Détection dynamique de la commande Docker.', benefit: 'Compatibilité entre Docker Compose V1 et V2.' },
                    { content: 'install:', info: 'Cible d\'installation.', benefit: 'Standardise la préparation de l\'environnement.' },
                    { content: '\tnpm install', info: 'Commande shell.', benefit: 'Simplifie la vie du dev : plus besoin de se souvenir de la commande exacte.' },
                    { content: 'test:', info: 'Cible de test.', benefit: 'Centralise le lancement des tests.' },
                    { content: 'build:', info: 'Cible de build Docker.', benefit: 'Encapsule la complexité du build d\'image.' },
                    { content: 'run:', info: 'Lancement de l\'environnement.', benefit: 'Unifie le démarrage des services via Compose.' }
                ]
            },
            '.github/workflows/main.yml': {
                lines: [
                    { content: 'on: push: branches: [ main ]', info: 'Déclencheur (Trigger).', benefit: 'Automatise le déploiement dès qu\'un changement arrive sur Main.' },
                    { content: 'jobs: test:', info: 'Job de test.', benefit: 'Garantit que le code est valide avant toute compilation.' },
                    { content: '  build-and-push:', info: 'Job de build et publication.', benefit: 'Crée l\'image et la pousse sur Docker Hub automatiquement.' },
                    { content: '    needs: test', info: 'Dépendance entre jobs.', benefit: 'Sécurité : on ne build PAS si les tests échouent.' },
                    { content: '    if: github.event_name == \'push\'', info: 'Condition.', benefit: 'Évite de pousser des images de test lors de simples Pull Requests.' }
                ]
            }
        };

        const fileList = document.getElementById('file-list');
        const codeView = document.getElementById('code-view');
        const filenameHeader = document.getElementById('current-filename');
        const infoPanel = document.getElementById('info-panel');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');
        const infoBenefit = document.getElementById('info-benefit');
        const closeInfo = document.getElementById('close-info');

        // Populate sidebar
        Object.keys(projectData).forEach(filename => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<span>📄</span> ${filename}`;
            div.onclick = () => selectFile(filename, div);
            fileList.appendChild(div);
        });

        function selectFile(filename, element) {
            // UI updates
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            filenameHeader.textContent = filename;
            infoPanel.classList.remove('visible');

            // Render code
            codeView.innerHTML = '';
            const data = projectData[filename];
            
            data.lines.forEach((lineData, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'line' + (lineData.info ? ' has-info' : '');
                
                // Very basic syntax highlighting
                let content = lineData.content
                    .replace(/FROM|WORKDIR|COPY|RUN|ARG|ENV|EXPOSE|HEALTHCHECK|CMD|const|let|module|exports/g, match => `<span class="hl-keyword">${match}</span>`)
                    .replace(/'[^']*'|"[^"]*"/g, match => `<span class="hl-string">${match}</span>`)
                    .replace(/\/\/.*/, match => `<span class="hl-comment">${match}</span>`);

                lineDiv.innerHTML = `
                    <div class="line-number">${index + 1}</div>
                    <div class="line-content">${content}</div>
                `;

                if (lineData.info) {
                    lineDiv.onclick = (e) => {
                        e.stopPropagation();
                        showInfo(lineData, lineDiv);
                    };
                }
                
                codeView.appendChild(lineDiv);
            });
        }

        function showInfo(lineData, lineElement) {
            document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));
            lineElement.classList.add('active');

            infoTitle.textContent = "Analyse de la ligne";
            infoDesc.textContent = lineData.info;
            infoBenefit.textContent = lineData.benefit;
            infoPanel.classList.add('visible');
        }

        closeInfo.onclick = () => {
            infoPanel.classList.remove('visible');
            document.querySelectorAll('.line').forEach(l => l.classList.remove('active'));
        };

        // Close info on click outside code
        document.body.onclick = (e) => {
            if (!infoPanel.contains(e.target) && !e.target.classList.contains('line')) {
                infoPanel.classList.remove('visible');
            }
        };

    </script>
</body>
</html>
